services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sistemavision
      MYSQL_USER: sistemavision
      MYSQL_PASSWORD: cambia_esta_clave_local
      MYSQL_ROOT_PASSWORD: cambia_esta_clave_root
    ports:
      - "3306:3306"
    volumes:
      - sistemavision_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pcambia_esta_clave_root"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  sistemavision_mysql:
